# Bring up Postgres + MinIO for the registry-server E2E suite.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up -d
#   # ... run registry-server against these ports, then run `cargo test -- --ignored` ...
#   docker compose -f docker-compose.e2e.yml down -v
#
# Ports are deliberately non-default so this stack can co-exist with a developer's own
# Postgres/MinIO on the same host. CI sets ports to 0 so Docker assigns free
# loopback ports atomically and uses a unique COMPOSE_PROJECT_NAME per job.
# No fixed container_name may bypass that project boundary.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mockforge_registry
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mockforge_registry"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data  # Ephemeral; every CI run starts fresh.

  minio:
    # Upstream MinIO stopped publishing pullable community images (quay.io and
    # Docker Hub tags now 401); pgsty/minio is the maintained community build and
    # ships curl + mc, so it serves both the server and the bucket-init step.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/mockforge-plugins &&
        mc mb --ignore-existing local/mockforge-specs &&
        echo 'buckets ready'
      "
