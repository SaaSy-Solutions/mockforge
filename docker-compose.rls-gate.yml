# Postgres + MinIO for the RLS coverage gate (scripts/rls-e2e-gate.sh, #832).
#
# WHY THIS IS A SEPARATE FILE FROM docker-compose.e2e.yml
#
# The RLS gate runs the E2E suite a SECOND time per PR, against a NOBYPASSRLS
# role. If it reused docker-compose.e2e.yml it would want the same fixed host
# ports (55432 / 59000) and the same `container_name`s as the required
# "Registry E2E (Postgres + MinIO)" job.
#
# The self-hosted CI host runs multiple runners side by side, so those two
# stacks can be live at the same moment across different workflow runs even
# though the jobs are serialized *within* a run. That is not hypothetical: it
# took the required check down on PR #965 with
#
#   Error response from daemon: failed to set up container networking: driver
#   failed programming external connectivity on endpoint mockforge-e2e-db:
#   failed to bind host port 0.0.0.0:55432/tcp: address already in use
#
# — the base job failed before running a single test, so the PR looked broken
# when nothing was wrong with it.
#
# A second stack on its own ports and its own container names cannot contend
# with the required check, whatever the interleaving. The base compose file is
# deliberately left untouched so this change cannot regress the job that gates
# every PR.
#
# Ports are still overridable (PG_PORT / MINIO_PORT) for anyone running two
# gates at once locally.

services:
  db:
    image: postgres:15-alpine
    container_name: mockforge-rls-gate-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mockforge_registry
    ports:
      - "${PG_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mockforge_registry"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data  # Ephemeral; every gate run starts fresh.

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: mockforge-rls-gate-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-59010}:9000"
      - "${MINIO_CONSOLE_PORT:-59011}:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: mockforge-rls-gate-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/mockforge-plugins &&
        mc mb --ignore-existing local/mockforge-specs &&
        echo 'buckets ready'
      "
