# Postgres + MinIO for the RLS coverage gate (scripts/rls-e2e-gate.sh, #832).
#
# The RLS lane runs all E2E tests a second time under a NOBYPASSRLS role.
# It keeps a separate Compose project and state from the baseline lane.
#
# Fixed global container names/ports previously caused cross-run teardown and
# bind races (#965). Neither fixture file may set container_name; generated
# names stay inside this invocation's unique COMPOSE_PROJECT_NAME.
#
# The gate script requests host port 0 and reads Docker's actual allocation.
# Direct local Compose use retains the documented defaults; callers may still
# override PG_PORT, MINIO_PORT and MINIO_CONSOLE_PORT.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mockforge_registry
    ports:
      - "127.0.0.1:${PG_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mockforge_registry"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data  # Ephemeral; every gate run starts fresh.

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_PORT:-59010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59011}:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/mockforge-plugins &&
        mc mb --ignore-existing local/mockforge-specs &&
        echo 'buckets ready'
      "
