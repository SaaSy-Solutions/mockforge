name: Docs Check

on:
  pull_request:
    # Check CLI changes even when their documentation was not updated, so a
    # new command cannot leave a stale snapshot for the next docs edit to find.
    # The hosted runner keeps these source scans off the Rust runner pool.
    paths:
      - 'book/**'
      - 'docs/**'
      - '*.md'
      - '*.markdown'
      - '**/*.md'
      - '**/*.markdown'
      - 'crates/mockforge-cli/src/**'
      - 'scripts/automated-tests/test-docs.sh'
      - 'scripts/check_docs_cli.py'
      - 'scripts/inject_docs_canonicals.py'
      - 'scripts/generate_docs_sitemap.py'
      - 'scripts/tests/test_docs_canonicals.py'
      - 'scripts/check_docs_drift.py'
      - 'scripts/check_config_field_drift.py'
      - 'scripts/docs-cli-surface.json'
      - '.github/workflows/docs-check.yml'
      - '.github/actions/setup-mdbook/**'
  workflow_dispatch:

# Push-on-main trigger removed: PR run already verifies the change. Only
# GitHub-internal context is interpolated below (workflow / ref / event_name).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: Verify mdBook Docs
    # Markdown build and Python source scans. They do not compile Rust, so
    # this stays on a GitHub-hosted runner. Same-repo PRs used to take a slot
    # on the two-runner [self-hosted, linux, x64, rust] pool whenever book/
    # changed, which is most feature PRs. Fork PRs already used ubuntu-latest.
    # "Verify mdBook Docs" is not a required status check, so a path miss
    # skips the workflow instead of leaving a required check pending.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify canonical link generation
        run: python3 scripts/tests/test_docs_canonicals.py

      - name: Setup mdBook
        uses: ./.github/actions/setup-mdbook

      - name: Run docs verification script
        run: bash scripts/automated-tests/test-docs.sh

      - name: Docs / code drift gate
        # Fails if any MOCKFORGE_* env var or top-level CLI subcommand
        # exists in code without a single mention in user-facing docs.
        # See scripts/check_docs_drift.py for the allowlist.
        run: python3 scripts/check_docs_drift.py

      - name: Config-field drift gate
        # Fails if any public field on a serde-derived config struct in
        # crates/mockforge-chaos/src/config.rs (and its companions) is
        # not mentioned anywhere in user-facing docs. See
        # scripts/check_config_field_drift.py for the target list and
        # allowlist.
        run: python3 scripts/check_config_field_drift.py

      - name: CLI / HTTP path accuracy gate
        # Fails if any `mockforge ...` command in a book code block uses a
        # subcommand or flag the CLI does not have, or if a documented
        # /__mockforge/... or /api/... path is not a registered route.
        # Baseline is 0. CLI surface comes from scripts/docs-cli-surface.json;
        # refresh it with --refresh-cli (see the script docstring).
        run: python3 scripts/check_docs_cli.py
