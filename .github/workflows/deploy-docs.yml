name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/deploy-docs.yml'
      - '.github/actions/setup-mdbook/**'
      - 'scripts/generate_docs_sitemap.py'
      - 'scripts/inject_docs_canonicals.py'
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Set per-runner CARGO_HOME on Hetzner
      # Keep rustup/cargo state off the shared `actions` user's ~/.cargo (#1191).
      if: runner.environment == 'self-hosted'
      run: echo "CARGO_HOME=/tmp/cargo-mockforge-${{ runner.name }}" >> "$GITHUB_ENV"

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup mdBook
      uses: ./.github/actions/setup-mdbook

    - name: Install Rust toolchain
      uses: ./.github/actions/rust-toolchain

    - name: Inject PostHog key
      # Project keys are public by design; unset leaves the placeholder, which
      # keeps book/analytics.js inert.
      env:
        POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
      run: |
        if [ -z "${POSTHOG_KEY}" ]; then
          echo "POSTHOG_KEY is not set; docs analytics stay off."
          exit 0
        fi
        if ! printf '%s' "${POSTHOG_KEY}" | grep -Eq '^phc_[A-Za-z0-9_-]+$'; then
          echo "::error::POSTHOG_KEY must be a PostHog project key (phc_...)."
          exit 1
        fi
        test "$(grep -c '"__POSTHOG_KEY__"' book/analytics.js)" = 1
        sed -i "s/\"__POSTHOG_KEY__\"/\"${POSTHOG_KEY}\"/" book/analytics.js

    - name: Build book
      run: |
        cd book
        mdbook build

    - name: Generate sitemap.xml
      run: python3 scripts/generate_docs_sitemap.py --book-dir book --base-url https://docs.mockforge.dev/

    - name: Add canonical links
      run: python3 scripts/inject_docs_canonicals.py --book-dir book --base-url https://docs.mockforge.dev/

    - name: Verify IndexNow key file is in the build
      run: test "$(cat book/book/b7e4c2a9f1d84630a5c7e2b9d0f3a614.txt)" = b7e4c2a9f1d84630a5c7e2b9d0f3a614

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./book/book

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  # Notify IndexNow (Bing, Yandex, Seznam, Naver, ...) of every URL in the
  # live docs sitemap after a successful production deploy. Best-effort: a
  # failure here never fails the deploy.
  indexnow:
    runs-on: [self-hosted, linux, x64, rust]
    needs: deploy
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: read
    steps:
    - name: Submit sitemap URLs to IndexNow
      env:
        INDEXNOW_HOST: docs.mockforge.dev
        INDEXNOW_KEY: b7e4c2a9f1d84630a5c7e2b9d0f3a614
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 --retry-delay 10 "https://${INDEXNOW_HOST}/sitemap.xml" -o sitemap.xml
        grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' > urls.txt
        echo "Found $(wc -l < urls.txt) URLs in sitemap"
        test -s urls.txt
        jq -n \
          --arg host "$INDEXNOW_HOST" \
          --arg key "$INDEXNOW_KEY" \
          --arg keyLocation "https://${INDEXNOW_HOST}/${INDEXNOW_KEY}.txt" \
          --rawfile urls urls.txt \
          '{host: $host, key: $key, keyLocation: $keyLocation, urlList: ($urls | split("\n") | map(select(length > 0)))}' \
          > payload.json
        status=$(curl -sS -o response.txt -w '%{http_code}' \
          -X POST "https://api.indexnow.org/indexnow" \
          -H 'Content-Type: application/json; charset=utf-8' \
          --data @payload.json)
        echo "IndexNow responded HTTP ${status}"
        cat response.txt || true
        case "$status" in 200|202) ;; *) exit 1 ;; esac
