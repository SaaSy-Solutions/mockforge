name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/deploy-docs.yml'
      - '.github/actions/setup-mdbook/**'
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Set per-runner CARGO_HOME on Hetzner
      # Keep rustup/cargo state off the shared `actions` user's ~/.cargo (#1191).
      if: runner.environment == 'self-hosted'
      run: echo "CARGO_HOME=/tmp/cargo-mockforge-${{ runner.name }}" >> "$GITHUB_ENV"

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup mdBook
      uses: ./.github/actions/setup-mdbook

    - name: Install Rust toolchain
      uses: ./.github/actions/rust-toolchain

    - name: Inject PostHog key
      # Project keys are public by design; unset leaves the placeholder, which
      # keeps book/analytics.js inert.
      env:
        POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
      run: |
        if [ -z "${POSTHOG_KEY}" ]; then
          echo "POSTHOG_KEY is not set; docs analytics stay off."
          exit 0
        fi
        if ! printf '%s' "${POSTHOG_KEY}" | grep -Eq '^phc_[A-Za-z0-9_-]+$'; then
          echo "::error::POSTHOG_KEY must be a PostHog project key (phc_...)."
          exit 1
        fi
        test "$(grep -c '"__POSTHOG_KEY__"' book/analytics.js)" = 1
        sed -i "s/\"__POSTHOG_KEY__\"/\"${POSTHOG_KEY}\"/" book/analytics.js

    - name: Build book
      run: |
        cd book
        mdbook build

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./book/book

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
