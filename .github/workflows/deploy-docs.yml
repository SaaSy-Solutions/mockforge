name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/deploy-docs.yml'
      - '.github/actions/setup-mdbook/**'
      - 'scripts/generate_docs_sitemap.py'
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Set per-runner CARGO_HOME on Hetzner
      # Keep rustup/cargo state off the shared `actions` user's ~/.cargo (#1191).
      if: runner.environment == 'self-hosted'
      run: echo "CARGO_HOME=/tmp/cargo-mockforge-${{ runner.name }}" >> "$GITHUB_ENV"

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup mdBook
      uses: ./.github/actions/setup-mdbook

    - name: Install Rust toolchain
      uses: ./.github/actions/rust-toolchain

    - name: Build book
      run: |
        cd book
        mdbook build

    - name: Generate sitemap.xml
      run: python3 scripts/generate_docs_sitemap.py --book-dir book --base-url https://docs.mockforge.dev/

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./book/book

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
