name: Kubernetes Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'k8s/**'
      - 'helm/**'
      - '.github/workflows/k8s-tests.yml'
  workflow_dispatch:
  # Weekly run against main. The Chaos Engineering job only runs here and on
  # workflow_dispatch: it is too slow for every PR.
  schedule:
    - cron: '0 6 * * 1'

# Push-on-main trigger removed: PR run already verifies the change. Only
# GitHub-internal context is interpolated below (workflow / ref / event_name).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # kubeconform parses every manifest (YAML syntax) and validates it
      # offline against the Kubernetes JSON schemas, plus the datree CRD
      # catalog for the operator kinds (ServiceMonitor, SecretStore,
      # ExternalSecret). This replaces `kubectl --dry-run=client`, which still
      # needs an API server for discovery, and kubeval, whose schema host is
      # gone. CustomResourceDefinitions have no published schema; the KinD job
      # applies k8s/crd/ to a real API server instead.
      - name: Validate manifests with kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          ./kubeconform -summary -strict \
            -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/

  lint-helm-charts:
    name: Lint Helm Charts
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.13.0'

      - name: Lint Helm charts
        run: |
          helm lint helm/mockforge

      - name: Template Helm charts
        run: |
          helm template mockforge helm/mockforge \
            --namespace mockforge \
            --create-namespace \
            --values helm/mockforge/values.yaml \
            > "$RUNNER_TEMP/rendered-manifests.yaml"

      # Offline schema validation (`kubectl --dry-run=client` needs an API
      # server for discovery, so it cannot run here).
      - name: Validate rendered templates
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -summary -strict "$RUNNER_TEMP/rendered-manifests.yaml"

      - name: Check for deprecated APIs
        run: |
          # kubent (Kubernetes No Trouble), advisory only
          curl -fsSL https://github.com/doitintl/kube-no-trouble/releases/download/0.7.3/kubent-0.7.3-linux-amd64.tar.gz | tar xz kubent
          ./kubent --cluster=false --helm3=false -f "$RUNNER_TEMP/rendered-manifests.yaml" || echo "kubent reported deprecated APIs (advisory)"

  security-scan:
    name: Security Scan
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload Checkov SARIF to code scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-results.sarif
          # Advisory: findings go to the code-scanning tab via the SARIF
          # upload below instead of failing the job. The gate that matters
          # for these example manifests (do they deploy under the
          # "restricted" Pod Security Standard) is the KinD job.
          soft_fail: true

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif

      # The Checkov docker action runs as root and leaves a root-owned
      # checkov-results.sarif/ in the workspace. On a self-hosted runner that
      # breaks actions/checkout (EACCES) for every later job on the runner.
      - name: Restore workspace ownership
        if: always()
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:3 chown -R "$(id -u):$(id -g)" /w

      - name: Run kube-score
        run: |
          # Advisory report; kube-score exits non-zero on any finding.
          curl -fsSL https://github.com/zegl/kube-score/releases/download/v1.20.0/kube-score_1.20.0_linux_amd64 -o kube-score
          chmod +x kube-score
          ./kube-score score k8s/*.yaml || echo "kube-score reported findings (advisory)"

      - name: Run Polaris audit
        run: |
          # Install polaris CLI instead of deploying full dashboard
          curl -fsSL https://github.com/FairwindsOps/polaris/releases/download/v10.2.5/polaris_10.2.5_linux_amd64.tar.gz | tar xz polaris
          ./polaris audit --audit-path k8s/ --format pretty || echo "Polaris audit completed with warnings"

  test-in-kind:
    name: Test in KinD Cluster
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Self-hosted runners on one host share the `actions` user's HOME and
      # docker daemon: give each run its own kubeconfig and cluster name so
      # concurrent KinD jobs cannot clobber each other's context.
      - name: Isolate kubeconfig
        run: echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mockforge-test-${{ github.run_id }}

      - name: Build and load Docker image
        run: |
          docker build -t mockforge:test .
          kind load docker-image mockforge:test --name mockforge-test-${{ github.run_id }}

      # Applies the core manifests (namespace with the "restricted" Pod
      # Security Standard, RBAC, config, services, StatefulSet, CRDs) and
      # server-side dry-runs the CRD-free add-ons. ServiceMonitor and
      # ExternalSecrets need operator CRDs; kubeconform covers those.
      - name: Deploy MockForge
        run: scripts/k8s-deploy-core.sh mockforge:test mockforge

      - name: Wait for rollout
        run: |
          kubectl rollout status statefulset/mockforge -n mockforge --timeout=300s

      # Each replica must own its recorder volume (SQLite must not be shared).
      - name: Verify per-replica recorder volumes
        run: |
          kubectl get pvc -n mockforge
          replicas="$(kubectl get statefulset mockforge -n mockforge -o jsonpath='{.spec.replicas}')"
          for i in $(seq 0 $((replicas - 1))); do
            claim="$(kubectl get pod "mockforge-$i" -n mockforge \
              -o jsonpath='{.spec.volumes[?(@.name=="recorder-db")].persistentVolumeClaim.claimName}')"
            phase="$(kubectl get pvc "$claim" -n mockforge -o jsonpath='{.status.phase}')"
            echo "mockforge-$i -> $claim ($phase)"
            [ "$claim" = "recorder-db-mockforge-$i" ] && [ "$phase" = "Bound" ]
          done

      - name: Run smoke tests
        run: |
          kubectl run curl --image=curlimages/curl:latest --rm -i --restart=Never -- \
            sh -c 'curl -fsS http://mockforge.mockforge.svc.cluster.local:3000/health/live && curl -fsS http://mockforge.mockforge.svc.cluster.local:3000/health/ready'

      - name: Check pod logs
        if: failure()
        run: |
          kubectl logs -n mockforge -l app=mockforge --tail=100

      - name: Describe pods
        if: failure()
        run: |
          kubectl describe pods -n mockforge

  integration-tests:
    name: Integration Tests
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30
    needs: test-in-kind

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Self-hosted runners on one host share the `actions` user's HOME and
      # docker daemon: give each run its own kubeconfig and cluster name so
      # concurrent KinD jobs cannot clobber each other's context.
      - name: Isolate kubeconfig
        run: echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mockforge-integration-${{ github.run_id }}

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Install Prometheus Operator
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --wait

      - name: Build and load image
        run: |
          docker build -t mockforge:test .
          kind load docker-image mockforge:test --name mockforge-integration-${{ github.run_id }}

      - name: Install MockForge with Helm
        run: |
          helm install mockforge helm/mockforge \
            --namespace mockforge \
            --create-namespace \
            --set image.repository=mockforge \
            --set image.tag=test \
            --set image.pullPolicy=Never \
            --wait \
            --timeout 5m

      - name: Run integration tests
        run: |
          # HTTP tests
          kubectl run test-http --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f http://mockforge.mockforge.svc.cluster.local:3000/health/ready

          # Metrics tests
          kubectl run test-metrics --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f http://mockforge.mockforge.svc.cluster.local:9090/metrics

          # Admin API tests (/health/* on the admin port sits behind admin auth)
          kubectl run test-admin --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f http://mockforge.mockforge.svc.cluster.local:9080/__mockforge/health

      - name: Test service discovery
        run: |
          kubectl run test-dns --image=busybox:latest --rm -i --restart=Never -- \
            nslookup mockforge.mockforge.svc.cluster.local

      - name: Verify Prometheus scraping
        run: |
          kubectl port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090 &
          sleep 10
          curl -s 'http://localhost:9090/api/v1/query?query=up{job="mockforge"}' | jq '.data.result'

      - name: Cleanup
        if: always()
        run: |
          helm uninstall mockforge -n mockforge
          kubectl delete namespace mockforge

  chaos-tests:
    name: Chaos Engineering Tests
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30
    # Slow (Chaos Mesh install + two timed experiments), so manual and weekly
    # only. Gating this on `push` left it dead: push is not a trigger here.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Self-hosted runners on one host share the `actions` user's HOME and
      # docker daemon: give each run its own kubeconfig and cluster name so
      # concurrent KinD jobs cannot clobber each other's context.
      - name: Isolate kubeconfig
        run: echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mockforge-chaos-${{ github.run_id }}

      - name: Setup Helm
        uses: azure/setup-helm@v5

      # KinD nodes run containerd, not docker (the chart's default runtime).
      - name: Install Chaos Mesh
        run: |
          helm repo add chaos-mesh https://charts.chaos-mesh.org
          helm repo update chaos-mesh
          helm install chaos-mesh chaos-mesh/chaos-mesh \
            --version 2.8.4 \
            --namespace chaos-mesh \
            --create-namespace \
            --set chaosDaemon.runtime=containerd \
            --set chaosDaemon.socketPath=/run/containerd/containerd.sock \
            --set dashboard.create=false \
            --wait \
            --timeout 5m

      - name: Deploy MockForge
        run: |
          docker build -t mockforge:test .
          kind load docker-image mockforge:test --name mockforge-chaos-${{ github.run_id }}
          scripts/k8s-deploy-core.sh mockforge:test mockforge
          kubectl rollout status statefulset/mockforge -n mockforge --timeout=300s

      - name: Run pod failure chaos
        run: |
          kubectl apply -f - <<EOF
          apiVersion: chaos-mesh.org/v1alpha1
          kind: PodChaos
          metadata:
            name: pod-failure-test
            namespace: mockforge
          spec:
            action: pod-failure
            mode: one
            duration: '30s'
            selector:
              namespaces:
                - mockforge
              labelSelectors:
                app: mockforge
          EOF
          sleep 35

      # StatefulSets have no Available condition: wait for every replica to
      # be Ready again, then hit the service.
      - name: Verify recovery
        run: |
          kubectl rollout status statefulset/mockforge -n mockforge --timeout=180s
          kubectl wait --for=condition=Ready pod -l app=mockforge -n mockforge --timeout=180s
          kubectl run curl-recovery --image=curlimages/curl:latest --rm -i --restart=Never -n default -- \
            curl -fsS http://mockforge.mockforge.svc.cluster.local:3000/health/ready

      - name: Run network delay chaos
        run: |
          kubectl apply -f - <<EOF
          apiVersion: chaos-mesh.org/v1alpha1
          kind: NetworkChaos
          metadata:
            name: network-delay-test
            namespace: mockforge
          spec:
            action: delay
            mode: one
            selector:
              namespaces:
                - mockforge
              labelSelectors:
                app: mockforge
            delay:
              latency: '100ms'
              correlation: '100'
              jitter: '0ms'
            duration: '30s'
          EOF
          sleep 35

      - name: Cleanup chaos experiments
        if: always()
        run: |
          kubectl delete podchaos pod-failure-test -n mockforge || true
          kubectl delete networkchaos network-delay-test -n mockforge || true

      - name: Check pod logs
        if: failure()
        run: |
          kubectl get pods,pvc -n mockforge
          kubectl describe pods -n mockforge
          kubectl logs -n mockforge -l app=mockforge --tail=100

  cost-estimation:
    name: Cost Estimation
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'  # Only run on manual trigger

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Estimate resource costs from manifests
        run: |
          # Parse resource requests/limits from manifests
          echo "## Resource Requirements Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CPU and Memory Requests/Limits:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 10 "resources:" k8s/statefulset.yaml | grep -E "(cpu|memory):" || echo "No resource limits found"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: Actual costs depend on your cloud provider and cluster configuration." >> $GITHUB_STEP_SUMMARY
