name: Contract Diff Verification

on:
  # Narrowed from repo-wide **/*.{json,yaml,yml}. This job does a full
  # `--release --features all-protocols` CLI build BEFORE it detects whether any
  # OpenAPI spec changed, so the old globs paid that build on every incidental
  # JSON/YAML edit (tsconfig, package.json, Cargo configs, CI yaml, test
  # fixtures) only to self-skip. OpenAPI specs in this repo live under
  # examples/ and specs/; the job's own find-step still scans the whole tree, so
  # no committed spec escapes analysis once the workflow is triggered.
  pull_request:
    paths:
      - 'examples/**/*.json'
      - 'examples/**/*.yaml'
      - 'examples/**/*.yml'
      - 'specs/**'
      - 'openapi.yaml'
      - 'openapi.json'
      - 'crates/mockforge-core/src/ai_contract_diff/**'
      - 'crates/mockforge-cli/src/contract_diff_commands.rs'
      - '.github/workflows/contract-diff.yml'
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Path to OpenAPI spec file'
        required: true
        type: string
      request_path:
        description: 'Path to request JSON file (optional)'
        required: false
        type: string
      llm_provider:
        description: 'LLM provider (openai, anthropic, ollama)'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
          - anthropic
          - ollama
          - openai-compatible

# Push-on-main trigger removed: PR run already verifies the change. Only
# GitHub-internal context is interpolated below (workflow / ref / event_name).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUSTUP_TOOLCHAIN: stable

jobs:
  contract-diff:
    name: Contract Diff Analysis
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Set per-runner CARGO_HOME
        # `runner.name` is unavailable in workflow- or job-level `env:` blocks
        # (GH Actions context: `runner.*` is step-scoped). Writing to
        # `$GITHUB_ENV` here exports it to every subsequent step in this job,
        # including the rust-toolchain composite action and rust-cache.
        run: echo "CARGO_HOME=/tmp/cargo-mockforge-${{ runner.name }}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect OpenAPI spec files
        id: detect-specs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_SPEC: ${{ github.event.inputs.spec_path }}
        run: |
          # A real spec has a top-level `openapi:`/`swagger:` key (YAML) or
          # `"openapi":`/`"swagger":` key (JSON). Grepping for the bare word
          # also matched package.json, docs and fixtures, which then failed to
          # parse as specs on every run.
          is_spec() { grep -qE '^(openapi|swagger):|^[[:space:]]*"(openapi|swagger)"[[:space:]]*:' "$1"; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            CANDIDATES=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- '*.yaml' '*.yml' '*.json')
          else
            CANDIDATES="$INPUT_SPEC"
          fi
          SPECS=""
          for f in $CANDIDATES; do
            [ -f "$f" ] && is_spec "$f" && SPECS="$SPECS $f"
          done
          SPECS="${SPECS# }"
          echo "Specs to analyze: ${SPECS:-<none>}"
          echo "specs=$SPECS" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install protoc
        run: 'dpkg -s protobuf-compiler libfontconfig1-dev libglib2.0-dev libgtk-3-dev libsoup2.4-dev libasound2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev > /dev/null 2>&1 || { echo "::error::Required system deps missing on self-hosted runner. Run on the runner host: sudo apt-get install -y protobuf-compiler libfontconfig1-dev libglib2.0-dev libgtk-3-dev libsoup2.4-dev libasound2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev"; exit 1; }'

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-target-contract-diff-${{ hashFiles('**/Cargo.lock') }}

      - name: Build MockForge CLI
        if: steps.detect-specs.outputs.specs != ''
        run: cargo build --release --package mockforge-cli --features all-protocols

      - name: Run contract diff analysis
        id: analyze
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SPECS: ${{ steps.detect-specs.outputs.specs }}
          REQUEST_PATH: ${{ github.event.inputs.request_path }}
          LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'openai' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          RESULTS_DIR="contract-diff-results"
          mkdir -p "$RESULTS_DIR"
          : > "$RESULTS_DIR/summary.md"

          if [ -z "$SPECS" ]; then
            echo "No changed OpenAPI specs; nothing to analyze"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FAILED=0
          TOTAL=0
          for SPEC in $SPECS; do
            TOTAL=$((TOTAL + 1))
            NAME=$(echo "$SPEC" | tr '/' '_')
            REPORT="$RESULTS_DIR/${NAME}.md"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              if git cat-file -e "$BASE_SHA:$SPEC" 2>/dev/null; then
                git show "$BASE_SHA:$SPEC" > "/tmp/base-$NAME"
                ./target/release/mockforge contract-diff compare \
                  --old-spec "/tmp/base-$NAME" --new-spec "$SPEC" --output "$REPORT"
                rc=$?
                if [ $rc -eq 0 ]; then
                  echo "- \`$SPEC\`: no breaking changes" >> "$RESULTS_DIR/summary.md"
                else
                  FAILED=$((FAILED + 1))
                  echo "- \`$SPEC\`: **breaking changes or comparison error** (exit $rc)" >> "$RESULTS_DIR/summary.md"
                fi
              else
                echo "- \`$SPEC\`: new spec, nothing to compare against" >> "$RESULTS_DIR/summary.md"
              fi
            else
              # Manual dispatch: analyze a captured request against the spec.
              if [ -z "$REQUEST_PATH" ]; then
                echo "::error::workflow_dispatch needs request_path (contract-diff analyze compares a captured request to the spec)"
                FAILED=$((FAILED + 1))
                continue
              fi
              ./target/release/mockforge contract-diff analyze \
                --spec "$SPEC" --request-path "$REQUEST_PATH" \
                --output "$RESULTS_DIR/${NAME}.json" --llm-provider "$LLM_PROVIDER" \
                || FAILED=$((FAILED + 1))
            fi
          done

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          if [ $FAILED -gt 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload contract diff results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: contract-diff-results
          path: contract-diff-results/
          retention-days: 7

      - name: Comment PR with results
        # Fork PRs get a read-only token; skip rather than fail on the comment.
        if: >-
          github.event_name == 'pull_request'
          && steps.analyze.outputs.status != 'skipped'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS: ${{ steps.analyze.outputs.status }}
          TOTAL: ${{ steps.analyze.outputs.total }}
          FAILED: ${{ steps.analyze.outputs.failed }}
        run: |
          {
            echo "## Contract Diff Analysis"
            echo
            if [ "$STATUS" = "failed" ]; then
              echo "$FAILED of $TOTAL changed spec(s) have breaking changes or could not be compared."
            else
              echo "$TOTAL changed spec(s) analyzed, no breaking changes."
            fi
            echo
            cat contract-diff-results/summary.md
            for r in contract-diff-results/*.md; do
              [ "$(basename "$r")" = summary.md ] && continue
              [ -f "$r" ] || continue
              echo
              echo "<details><summary>$(basename "$r" .md)</summary>"
              echo
              head -c 20000 "$r"
              echo
              echo "</details>"
            done
          } > /tmp/contract-diff-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/contract-diff-comment.md

      - name: Fail if contract diff failed
        if: steps.analyze.outputs.status == 'failed'
        run: |
          echo "Contract diff analysis failed. Please review the results."
          exit 1
