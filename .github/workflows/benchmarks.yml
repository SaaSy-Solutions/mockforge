name: Benchmarks

on:
  # PR trigger narrowed from `crates/**/*.rs` (fired on every Rust change) to
  # just benchmark code + workspace deps. The PR signal we care about is
  # "did this change regress benchmarks" — broader paths burned a 10-15 min
  # self-hosted run per PR for output that wasn't driving review decisions.
  # Main-push still runs the full bench so the baseline published to the
  # `bench-baseline` branch stays current.
  pull_request:
    paths:
      - 'crates/*/benches/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/benchmarks.yml'
      - '.github/scripts/compare-benchmarks.js'
      - 'scripts/tests/test_benchmark_gate.py'
      - 'scripts/tests/test_paired_benchmarks.py'
      - 'scripts/ci/*benchmarks*.py'
      - 'scripts/ci/benchmark_measurements.py'
  push:
    branches:
      - main
  workflow_dispatch:

# Push-on-main retained: it republishes the bench-baseline branch.
# Concurrency keys are GitHub-internal context (not user-supplied), safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  REGRESSION_THRESHOLD: 5.0
  CARGO_BUILD_JOBS: "2"
  RUSTUP_TOOLCHAIN: "1.96.0"

jobs:
  benchmark:
    name: Run Benchmarks
    # A dedicated VM keeps other repository builds out of timing samples.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for baseline comparison

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Test benchmark comparison gate
        run: |
          python3 scripts/tests/test_benchmark_gate.py
          python3 scripts/tests/test_paired_benchmarks.py

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-target-bench-isolated-1.96.0-${{ hashFiles('**/Cargo.lock') }}

      # main is a protected branch, so main-push runs publish the baseline to
      # the unprotected `bench-baseline` branch instead of committing it.
      # The copy committed on main is only a fallback for the first run.
      # Compare the immutable PR base with the candidate on this host in
      # adjacent ABBA pairs on an isolated VM. A moving main baseline can compare a
      # merged PR to itself, and shared-host load is not comparable over time.
      - name: Run paired base and candidate benchmarks
        if: github.event_name == 'pull_request'
        env:
          BENCHMARK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/paired_benchmarks.py --base-sha "$BENCHMARK_BASE_SHA"

      - name: Run benchmarks
        if: github.event_name != 'pull_request'
        run: |
          cd crates/mockforge-core
          cargo bench --bench core_benchmarks -- --save-baseline current

      - name: Make comparison script executable
        run: chmod +x .github/scripts/compare-benchmarks.js

      - name: Compare benchmarks against baseline
        if: github.event_name == 'pull_request'
        id: compare
        continue-on-error: true
        env:
          BASELINE_DIR: paired-benchmarks
          CRITERION_DIR: paired-benchmarks/criterion
        run: node .github/scripts/compare-benchmarks.js compare

      - name: Save new baseline (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Saving new baseline from main branch..."
          node .github/scripts/compare-benchmarks.js save-baseline

      - name: Publish baseline to bench-baseline branch (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          dir="$(mktemp -d)"
          cp .github/benchmarks/baseline.json "$dir/baseline.json"
          cd "$dir"
          git init -q -b bench-baseline
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline.json
          git commit -qm "benchmark baseline from main@${SOURCE_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bench-baseline

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-results-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
          path: |
            target/criterion/
            benchmark-report.md
            paired-benchmarks/
          retention-days: 30

      - name: Generate performance dashboard
        env:
          BASELINE_DIR: ${{ github.event_name == 'pull_request' && 'paired-benchmarks' || '.github/benchmarks' }}
          CRITERION_DIR: ${{ github.event_name == 'pull_request' && 'paired-benchmarks/criterion' || 'target/criterion' }}
        run: |
          node .github/scripts/generate-dashboard.js

      - name: Upload dashboard
        uses: actions/upload-artifact@v7.0.1
        with:
          name: performance-dashboard
          path: performance-dashboard.html
          retention-days: 90

      - name: Comment PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            // Read the benchmark report
            let report = '';
            try {
              report = fs.readFileSync('benchmark-report.md', 'utf8');
            } catch (err) {
              report = '## 📊 Benchmark Results\n\n';
              report += '⚠️ Could not load detailed benchmark comparison.\n';
              report += 'Download the artifacts to see results.\n';
            }

            // Add links to artifacts and dashboard
            report += '\n---\n\n';
            report += '### Additional Resources\n\n';
            report += '- 📁 [Download detailed results](../../actions/runs/${{ github.run_id }})\n';
            report += '- 📊 [View performance dashboard](../../actions/runs/${{ github.run_id }})\n';
            report += '- 🔍 [Review HTML reports](../../actions/runs/${{ github.run_id }})\n';

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 Performance Benchmark Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }

      - name: Check for performance regression
        # outcome preserves the failure before continue-on-error changes the
        # conclusion. An output after a failed command is never set by bash -e.
        if: github.event_name == 'pull_request' && steps.compare.outcome == 'failure'
        run: |
          echo "::error::Benchmark comparison failed. Review the report and comparison logs."
          exit 1
