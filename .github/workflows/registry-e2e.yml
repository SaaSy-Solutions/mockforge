name: Registry E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/mockforge-registry-server/**'
      - 'crates/mockforge-registry-core/**'
      - 'docker-compose.e2e.yml'
      - 'docker-compose.rls-gate.yml'
      - '.github/workflows/registry-e2e.yml'
  # No `paths:` filter on pull_request — the workflow runs on EVERY PR so the
  # required "Registry E2E (Postgres + MinIO)" check always reports a status.
  # The `changes` job below gates the heavy work: non-registry PRs get a fast
  # skipped job (which branch protection counts as success) instead of a
  # never-reported check that would block the merge. Mirrors ci.yml's pattern.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Preserve the bounded build parallelism on both the trusted Hetzner lane
  # and the existing hosted public-fork lane.
  CARGO_BUILD_JOBS: "2"
  RUSTUP_TOOLCHAIN: "1.96.0"

concurrency:
  group: registry-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Trusted events use the existing Hetzner pool; forks retain hosted isolation.
  # Lets the heavy registry-e2e job below be skipped (= success for branch
  # protection) on PRs that don't touch the registry, so this can be a required
  # check without blocking unrelated PRs. Non-PR events always run the suite.
  changes:
    name: Detect registry scope
    timeout-minutes: 15
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust"]') || 'ubuntu-latest' }}
    outputs:
      registry: ${{ steps.filter.outputs.registry }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine whether registry files changed
        id: filter
        env:
          # Routed through env (not interpolated into the script) per workflow
          # injection best practice. Both are GitHub-controlled values anyway.
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Non-PR event ($EVENT_NAME): running registry E2E."
            echo "registry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "Changed files:"; printf '%s\n' "$files"
          registry=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              crates/mockforge-registry-server/*|crates/mockforge-registry-core/*|docker-compose.e2e.yml|docker-compose.rls-gate.yml|.github/workflows/registry-e2e.yml) registry=true ;;
            esac
          done <<< "$files"
          echo "Registry E2E required: registry=$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

  registry-e2e:
    name: Registry E2E (Postgres + MinIO)
    needs: changes
    if: ${{ needs.changes.outputs.registry == 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust"]') || 'ubuntu-latest' }}
    timeout-minutes: 45

    env:
      # Per-job endpoints are exported after Docker allocates free loopback ports.
      JWT_SECRET: "e2e-jwt-secret-do-not-use-in-prod"
      S3_BUCKET: "mockforge-plugins"
      S3_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      # Shared bearer token between the registry server and the E2E
      # tests that hit `/api/v1/internal/*`. Kept literal so both
      # processes see the same value.
      MOCKFORGE_INTERNAL_API_TOKEN: "e2e-internal-token-do-not-use-in-prod"
      # paid_flow_e2e signs Stripe webhook events with this secret; the
      # registry server verifies them with the same value. Must match the
      # `DEFAULT_WEBHOOK_SECRET` constant in tests/paid_flow_e2e.rs.
      STRIPE_WEBHOOK_SECRET: "whsec_e2e_test_secret"

      # Lift the rate limiter for E2E. All requests originate from
      # localhost so they share the same `ip:unknown` bucket; the
      # default 60/min global + 100/min per-user is exhausted by the
      # marketplace tests' register -> org -> workspace -> publish -> search
      # chains multiplied across 5 tests serialized by --test-threads=1.
      # The cap is still > test demand by ~3 orders of magnitude, so
      # any genuine runaway loop in a future test will still be caught.
      RATE_LIMIT_PER_MINUTE: "100000"
      RATE_LIMIT_PER_USER: "100000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify registry fixture capabilities on Hetzner
        if: runner.environment == 'self-hosted'
        run: |
          for tool in docker protoc curl python3 timeout; do
            command -v "$tool" >/dev/null || { echo "::error::Hetzner runner lacks $tool; operator provisioning is required."; exit 1; }
          done
          timeout_version="$(LC_ALL=C timeout --version)"
          [[ "$timeout_version" == "timeout (GNU coreutils)"* ]]
          python3 - <<'PYPROBE'
          import ctypes, importlib.util, os, signal
          spec = importlib.util.spec_from_file_location('owned', 'scripts/ci-owned-process.py')
          owned = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(owned)
          owned.process_context()
          if not hasattr(signal, 'pidfd_send_signal'):
              raise SystemExit('Linux pidfd signaling is required')
          descriptor = os.pidfd_open(os.getpid())
          signal.pidfd_send_signal(descriptor, 0)
          os.close(descriptor)
          libc = ctypes.CDLL(None, use_errno=True)
          previous = ctypes.c_int()
          if libc.prctl(2, ctypes.byref(previous), 0, 0, 0) != 0:
              raise OSError(ctypes.get_errno(), 'Cannot read own parent-death signal')
          try:
              if libc.prctl(1, signal.SIGALRM, 0, 0, 0) != 0:
                  raise OSError(ctypes.get_errno(), 'Parent-death signaling is required')
          finally:
              if libc.prctl(1, previous.value, 0, 0, 0) != 0:
                  raise OSError(ctypes.get_errno(), 'Cannot restore own parent-death signal')
          PYPROBE
          timeout --signal=KILL 20s docker info --format '{{.ID}}'
          timeout --signal=KILL 20s docker compose version

      - name: Set per-runner CARGO_HOME on Hetzner
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_HOME=/tmp/cargo-mockforge-${{ runner.name }}" >> "$GITHUB_ENV"

      - name: Verify provisioned Rust toolchain on Hetzner
        if: runner.environment == 'self-hosted'
        env:
          EXPECTED_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        run: |
          command -v rustup >/dev/null || { echo "::error::Hetzner runner lacks rustup; operator provisioning is required."; exit 1; }
          rustc_version="$(RUSTUP_AUTO_INSTALL=0 rustup run "$EXPECTED_TOOLCHAIN" rustc --version)"
          cargo_version="$(RUSTUP_AUTO_INSTALL=0 rustup run "$EXPECTED_TOOLCHAIN" cargo --version)"
          [[ "$rustc_version" == "rustc $EXPECTED_TOOLCHAIN "* ]]
          [[ "$cargo_version" == "cargo $EXPECTED_TOOLCHAIN "* ]]
          printf '%s\n' "$rustc_version" "$cargo_version"

      - name: Install Rust toolchain
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/rust-toolchain

      - name: Ensure rustup default = 1.96.0
        if: runner.environment == 'github-hosted'
        run: rustup default 1.96.0

      - name: Free hosted-runner disk
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install protoc
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # Same target/ guard as integration-tests.yml — keeps the shared NVMe from
      # filling up across sibling runners.
      - name: Guard target/ size
        run: |
          if [ -d target ] && [ "$(du -sb target | awk '{print $1}')" -gt 32212254720 ]; then
            echo "target/ exceeds 30GB — wiping"
            rm -rf target
          fi

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: "CARGO_HOME"

      - name: Build registry-server
        # Debug build (not --release): this is a behavioral E2E lane, not a perf
        # benchmark, so an optimized build buys nothing but costs ~3-5x more CPU
        # time and disk. The runner host is heavily shared; a lighter/faster build
        # is far less likely to be starved or reclaimed mid-job (the lane
        # historically died before the build even finished). Retry once under
        # shared-runner resource pressure, same as the sibling workflow.
        run: |
          cargo build -p mockforge-registry-server \
            || (echo "::warning::first build failed, retrying once" \
                && cargo build -p mockforge-registry-server)

      - name: Allocate run-owned fixture state
        run: |
          fixture_root="$(mktemp -d "${RUNNER_TEMP}/mf-e2e.XXXXXXXX")"
          fixture_id="$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            echo "FIXTURE_ROOT=$fixture_root"
            echo "COMPOSE_PROJECT_NAME=mf-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${fixture_id}"
            echo "PG_PORT=0"
            echo "MINIO_PORT=0"
            echo "MINIO_CONSOLE_PORT=0"
          } >> "$GITHUB_ENV"

      - name: Start Postgres + MinIO
        run: |
          # A new project has nothing to clean. Never remove another run's
          # containers by a shared name or use a daemon-wide prune.
          docker compose -f docker-compose.e2e.yml up -d
          for service in db minio; do
            cid="$(docker compose -f docker-compose.e2e.yml ps -q "$service")"
            test -n "$cid"
            if [ "$service" = db ]; then
              echo "FIXTURE_DB_CID=$cid" >> "$GITHUB_ENV"
            else
              echo "FIXTURE_MINIO_CID=$cid" >> "$GITHUB_ENV"
            fi
            healthy=false
            for _ in {1..60}; do
              if [ "$(docker inspect --format='{{.State.Health.Status}}' "$cid")" = healthy ]; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != true ]; then
              echo "::error::$service never became healthy in this job's project"
              exit 1
            fi
          done
          pg_endpoint="$(docker compose -f docker-compose.e2e.yml port db 5432)"
          minio_endpoint="$(docker compose -f docker-compose.e2e.yml port minio 9000)"
          [[ "$pg_endpoint" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          [[ "$minio_endpoint" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          {
            echo "DATABASE_URL=postgres://postgres:password@${pg_endpoint}/mockforge_registry"
            echo "S3_ENDPOINT=http://${minio_endpoint}"
          } >> "$GITHUB_ENV"
          docker compose -f docker-compose.e2e.yml logs minio-init || true

      - name: Start registry-server (background)
        env:
          # Pin local artifact storage to a fresh, writable, per-job dir.
          # Without this the server falls back to a RELATIVE ./data/storage
          # (storage.rs:101) inside the persistent self-hosted _work checkout.
          # A prior run can leave ./data/storage owned by another user, so
          # startup create_dir_all(./data/storage) is a no-op success (dir
          # exists) but per-artifact create_dir_all(./data/storage/<kind>/<id>)
          # then fails on permissions — surfacing as marketplace_e2e "Failed to
          # create directory" 500s that block every registry PR. `runner.temp`
          # is cleaned each job. (Must live in this STEP env, not the job-level
          # env block — the `runner` context isn't available there.)
          STORAGE_PATH: "${{ env.FIXTURE_ROOT }}/storage"
          # MinIO is configured above, so a failed S3 health check must fail
          # the job rather than silently fall back to STORAGE_PATH (#1236).
          STORAGE_REQUIRE_S3: "true"
        run: |
          mkdir -p "$STORAGE_PATH"

          # The server does not accept an inherited listener. Pick a free port
          # immediately before launch; if the bind race is lost, fail closed.
          # Never kill the process that won that race.
          REGISTRY_PORT="$(python3 - <<'PYPORT'
          import socket
          with socket.socket() as listener:
              listener.bind(('127.0.0.1', 0))
              print(listener.getsockname()[1])
          PYPORT
          )"
          {
            echo "REGISTRY_PORT=$REGISTRY_PORT"
            echo "REGISTRY_URL=http://127.0.0.1:$REGISTRY_PORT"
          } >> "$GITHUB_ENV"
          SERVER_PID="$(PORT="$REGISTRY_PORT" HOST="127.0.0.1" \
            python3 scripts/ci-owned-process.py start \
              --receipt "$FIXTURE_ROOT/server.json" --log registry-server.log \
              -- ./target/debug/mockforge-registry-server)"
          echo "Waiting for registry-server (pid $SERVER_PID) on :${REGISTRY_PORT}..."
          for _ in {1..60}; do
            # If OUR process died (e.g. lost a bind race to a stale server),
            # stop immediately — never let the loop "pass" against someone
            # else's server.
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::registry-server (pid $SERVER_PID) exited during startup — likely failed to bind :${REGISTRY_PORT} (stale server on the runner?)."
              tail -200 registry-server.log || true
              exit 1
            fi
            if curl -sfS "http://localhost:${REGISTRY_PORT}/health" >/dev/null 2>&1; then
              echo "registry-server healthy"
              break
            fi
            sleep 1
          done
          # Final guard: OUR process must still be alive AND the port healthy.
          # The kill -0 check is what distinguishes "our server is serving" from
          # "a stale server answered our curl" (#782).
          if ! kill -0 "$SERVER_PID" 2>/dev/null \
             || ! curl -sfS "http://localhost:${REGISTRY_PORT}/health" >/dev/null 2>&1; then
            echo "::error::registry-server never became healthy (our pid alive: $(kill -0 "$SERVER_PID" 2>/dev/null && echo yes || echo no))"
            tail -200 registry-server.log || true
            exit 1
          fi

      - name: Observe owned fixture health
        run: |
          evidence_args=(--project "$COMPOSE_PROJECT_NAME" --compose docker-compose.e2e.yml
            --run-id "$GITHUB_RUN_ID" --output "$FIXTURE_ROOT/evidence.jsonl"
            --port "$REGISTRY_PORT" --receipt "$FIXTURE_ROOT/server.json"
            --db-cid "$FIXTURE_DB_CID" --minio-cid "$FIXTURE_MINIO_CID")
          python3 scripts/ci-fixture-evidence.py sample "${evidence_args[@]}"
          python3 scripts/ci-owned-process.py start \
            --receipt "$FIXTURE_ROOT/monitor.json" --log "$FIXTURE_ROOT/monitor.log" \
            -- python3 scripts/ci-fixture-evidence.py monitor "${evidence_args[@]}"

      - name: Run E2E tests
        # These E2E targets gate on `#[ignore]`. Pass `--ignored` to unlock them.
        # `--test-threads=1` keeps the tests serial; many of them create/delete orgs with
        # generated-but-occasionally-colliding slugs if two run at the same millisecond.
        run: |
          cargo test -p mockforge-registry-server \
            --test workspace_content_e2e \
            --test signup_flow_e2e \
            --test marketplace_e2e \
            --test hosted_capture_workspaces_e2e \
            --test cloud_verification_e2e \
            --test cloud_ai_contract_diff_e2e \
            --test diff_finding_incident_e2e \
            --test cloud_conformance_e2e \
            --test paid_flow_e2e \
            --test hosted_mock_overrides_e2e \
            --test audit_integrity_e2e \
            --test rls_coverage_e2e \
            --test hosted_mock_rls_routes_e2e \
            --test rls_join_coverage_e2e \
            --test cross_tenant_chaos_capture_e2e \
            --test seed_credentials_neutralised \
            -- --ignored --nocapture --test-threads=1

      - name: Verify contract probe database claims
        env:
          MOCKFORGE_PROBE_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          cargo test --locked -p mockforge-registry-server --lib \
            workers::contract_probe::postgres_tests::due_claims_serialize_and_failed_timestamp_rolls_back_run \
            -- --ignored --nocapture

      - name: Dump registry-server log on failure
        if: failure()
        run: |
          echo "===== registry-server.log (tail) ====="
          tail -500 registry-server.log || true

      - name: Stop registry-server
        if: always()
        run: |
          if [ -n "${FIXTURE_ROOT:-}" ]; then
            cleanup_rc=0
            # Stop only our monitor before stopping the fixture it observes.
            # A broken observer must not prevent server/Docker cleanup.
            python3 scripts/ci-owned-process.py stop "$FIXTURE_ROOT/monitor.json" || cleanup_rc=$?
            python3 scripts/ci-owned-process.py stop "$FIXTURE_ROOT/server.json" || cleanup_rc=$?
            exit "$cleanup_rc"
          fi

      - name: Tear down Postgres + MinIO
        if: always()
        run: |
          # Initialization may not have run. An empty project must never fall
          # back to Compose's checkout-derived default and remove a sibling.
          if [ -n "${COMPOSE_PROJECT_NAME:-}" ]; then
            [[ "$COMPOSE_PROJECT_NAME" == mf-e2e-* ]]
            timeout --signal=KILL 60s docker compose -f docker-compose.e2e.yml down --timeout 10 -v
          fi

      - name: Verify owned fixture cleanup evidence
        if: always()
        run: |
          if [ -n "${FIXTURE_ROOT:-}" ] && [ -f "$FIXTURE_ROOT/evidence.jsonl" ]; then
            python3 scripts/ci-fixture-evidence.py cleaned \
              --project "$COMPOSE_PROJECT_NAME" --compose docker-compose.e2e.yml \
              --run-id "$GITHUB_RUN_ID" --output "$FIXTURE_ROOT/evidence.jsonl"
            python3 scripts/ci-fixture-evidence.py verify \
              --project "$COMPOSE_PROJECT_NAME" --output "$FIXTURE_ROOT/evidence.jsonl"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: registry-server-log
          path: |
            registry-server.log
            ${{ env.FIXTURE_ROOT }}/evidence.jsonl
            ${{ env.FIXTURE_ROOT }}/monitor.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # RLS coverage gate (#832 / #960).
  #
  # Re-runs the same E2E suite with the request-path pool bound to a
  # NOSUPERUSER / NOBYPASSRLS role, so the tenant-isolation policies from
  # migrations 20250101000082 + 20250101000086 are ACTIVE. Any covered-table
  # query (36 org-scoped tables) that reaches
  # the database without `app.current_org_id` bound fail-closes to zero rows
  # and the E2E assertion depending on it fails.
  #
  # This is what makes request-path RLS coverage self-enforcing: without it,
  # a store method that forgets to route through `with_current_org` is
  # invisible until it fail-closes a live tenant in production. A pre-cutover
  # audit found ~20 such methods.
  #
  # Each lane now uses a distinct per-run Compose project with Docker-assigned
  # loopback ports. Fixed host ports/container names previously let concurrent
  # workflow runs kill one another's fixture (#965); job-level needs alone
  # cannot prevent cross-run contention on a shared Docker daemon.
  #
  # `needs: registry-e2e` is kept for a different reason: it means this only
  # spends runner time once the baseline suite is green, which keeps failures
  # attributable — a red here then means RLS, not a broken test.
  #
  # All of the setup lives in scripts/rls-e2e-gate.sh so the local dev loop and
  # CI exercise exactly the same provisioning, and the script self-checks that
  # the gate is actually armed (role is NOBYPASSRLS, every org_id table is
  # ENABLE+FORCE RLS or a documented exclusion, seeded rows are invisible
  # unbound and visible bound) before trusting a green run.
  # ---------------------------------------------------------------------------
  registry-e2e-rls:
    name: Registry E2E under RLS (NOBYPASSRLS)
    needs: [changes, registry-e2e]
    if: ${{ needs.changes.outputs.registry == 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify registry fixture capabilities on Hetzner
        if: runner.environment == 'self-hosted'
        run: |
          for tool in docker protoc curl python3 timeout; do
            command -v "$tool" >/dev/null || { echo "::error::Hetzner runner lacks $tool; operator provisioning is required."; exit 1; }
          done
          timeout_version="$(LC_ALL=C timeout --version)"
          [[ "$timeout_version" == "timeout (GNU coreutils)"* ]]
          python3 - <<'PYPROBE'
          import ctypes, importlib.util, os, signal
          spec = importlib.util.spec_from_file_location('owned', 'scripts/ci-owned-process.py')
          owned = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(owned)
          owned.process_context()
          if not hasattr(signal, 'pidfd_send_signal'):
              raise SystemExit('Linux pidfd signaling is required')
          descriptor = os.pidfd_open(os.getpid())
          signal.pidfd_send_signal(descriptor, 0)
          os.close(descriptor)
          libc = ctypes.CDLL(None, use_errno=True)
          previous = ctypes.c_int()
          if libc.prctl(2, ctypes.byref(previous), 0, 0, 0) != 0:
              raise OSError(ctypes.get_errno(), 'Cannot read own parent-death signal')
          try:
              if libc.prctl(1, signal.SIGALRM, 0, 0, 0) != 0:
                  raise OSError(ctypes.get_errno(), 'Parent-death signaling is required')
          finally:
              if libc.prctl(1, previous.value, 0, 0, 0) != 0:
                  raise OSError(ctypes.get_errno(), 'Cannot restore own parent-death signal')
          PYPROBE
          timeout --signal=KILL 20s docker info --format '{{.ID}}'
          timeout --signal=KILL 20s docker compose version

      - name: Set per-runner CARGO_HOME on Hetzner
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_HOME=/tmp/cargo-mockforge-${{ runner.name }}" >> "$GITHUB_ENV"

      - name: Verify provisioned Rust toolchain on Hetzner
        if: runner.environment == 'self-hosted'
        env:
          EXPECTED_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        run: |
          command -v rustup >/dev/null || { echo "::error::Hetzner runner lacks rustup; operator provisioning is required."; exit 1; }
          rustc_version="$(RUSTUP_AUTO_INSTALL=0 rustup run "$EXPECTED_TOOLCHAIN" rustc --version)"
          cargo_version="$(RUSTUP_AUTO_INSTALL=0 rustup run "$EXPECTED_TOOLCHAIN" cargo --version)"
          [[ "$rustc_version" == "rustc $EXPECTED_TOOLCHAIN "* ]]
          [[ "$cargo_version" == "cargo $EXPECTED_TOOLCHAIN "* ]]
          printf '%s\n' "$rustc_version" "$cargo_version"

      - name: Install Rust toolchain
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/rust-toolchain

      - name: Ensure rustup default = 1.96.0
        if: runner.environment == 'github-hosted'
        run: rustup default 1.96.0

      - name: Free hosted-runner disk
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install protoc
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Verify psql on Hetzner
        if: runner.environment == 'self-hosted'
        run: command -v psql >/dev/null || { echo "::error::Hetzner runner lacks psql; operator provisioning is required."; exit 1; }

      - name: Ensure psql client
        if: runner.environment == 'github-hosted'
        # ubuntu-latest images no longer ship psql; the RLS gate script
        # provisions the NOBYPASSRLS role through it.
        run: command -v psql > /dev/null 2>&1 || sudo apt-get install -y postgresql-client

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: "CARGO_HOME"

      # Static half of the gate: every statement on a FORCE-RLS table must run
      # GUC-bound on the runtime pool or be a reviewed ELEVATED owner-pool path.
      # The e2e run below only proves fail-closure on the paths it exercises.
      - name: RLS coverage audit (static)
        run: python3 scripts/check_rls_coverage.py

      - name: Run E2E suite with RLS active
        env:
          STORAGE_PATH: "${{ runner.temp }}/mf-rls-gate-storage"
          STATE_FILE: "${{ runner.temp }}/mf-rls-gate-state-${{ github.run_id }}-${{ github.run_attempt }}"
          SERVER_PID_FILE: "${{ runner.temp }}/mf-rls-gate-server-${{ github.run_id }}-${{ github.run_attempt }}.json"
          EVIDENCE_OUTPUT: "${{ runner.temp }}/mf-rls-evidence-${{ github.run_id }}-${{ github.run_attempt }}.jsonl"
        run: scripts/rls-e2e-gate.sh all

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: registry-server-log-rls
          path: |
            rls-gate-registry-server.log
            ${{ runner.temp }}/mf-rls-evidence-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
            ${{ runner.temp }}/mf-rls-gate-server-${{ github.run_id }}-${{ github.run_attempt }}.json.monitor.log
          if-no-files-found: ignore
