name: Ashburn registry, tunnel and runner images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ashburn-images.yml'
      - 'Dockerfile.registry'
      - 'Dockerfile.runner'
      - 'Dockerfile.tunnel'
      - 'crates/**'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      image:
        description: 'One image for a canary (mockforge-registry, mockforge-test-runner or mockforge-tunnel-relay); blank builds all'
        required: false
        default: ''

# Also used by docker-build.yml for the root MockForge image. Expensive Rust
# Docker builds share the self-hosted runners and run one at a time.
concurrency:
  group: mockforge-image-builds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.ref == 'refs/heads/main' && github.ref_protected &&
      (github.event_name == 'workflow_dispatch' || vars.MOCKFORGE_AUTO_IMAGE_PUBLISH == 'true')
    # This job only computes a JSON matrix and needs no package write.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          WANTED_IMAGE: ${{ inputs.image }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          sources = {
              'mockforge-registry': 'Dockerfile.registry',
              'mockforge-test-runner': 'Dockerfile.runner',
              'mockforge-tunnel-relay': 'Dockerfile.tunnel',
          }
          wanted = os.environ.get('WANTED_IMAGE', '')
          if wanted and wanted not in sources:
              raise SystemExit(f'unknown image: {wanted}')
          chosen = {wanted: sources[wanted]} if wanted else sources
          include = [{'app': app, 'dockerfile': dockerfile} for app, dockerfile in sorted(chosen.items())]
          print('matrix=' + json.dumps({'include': include}))
          PY

  build:
    needs: plan
    name: ${{ matrix.app }}
    if: >-
      github.ref == 'refs/heads/main' && github.ref_protected &&
      (github.event_name == 'workflow_dispatch' || vars.MOCKFORGE_AUTO_IMAGE_PUBLISH == 'true')
    runs-on: [self-hosted, linux, x64, rust]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    env:
      BUILDER: mockforge-publish-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep the GHCR credential and buildx state out of the shared runner
      # user's ~/.docker (docs/IMAGE_PUBLISHER_ISOLATION.md).
      - name: Create private Docker config
        run: |
          config="$(mktemp -d "$RUNNER_TEMP/ghcr-auth-XXXXXXXX")"
          chmod 700 "$config"
          echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"
      # A fresh builder per run, removed below, so no BuildKit state is
      # shared with PR builds on the same host.
      - uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.BUILDER }}
          cleanup: false
          driver-opts: |
            memory=20g
            memory-swap=20g
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.app }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/saasy-solutions/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/saasy-solutions/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=ghcr.io/saasy-solutions/${{ matrix.app }}:buildcache,mode=max
      - name: Record immutable digest
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no manifest digest"; exit 1; }
          ref="ghcr.io/saasy-solutions/${APP}:${GITHUB_SHA}@${DIGEST}"
          echo "${APP} ${ref}"
          { echo "### ${APP}"; echo; echo "\`${ref}\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove builder and credential
        if: always()
        run: |
          docker buildx rm --force "$BUILDER" 2>/dev/null || true
          case "${DOCKER_CONFIG:-}" in
            "$RUNNER_TEMP"/ghcr-auth-*)
              docker logout ghcr.io || true
              rm -rf -- "$DOCKER_CONFIG"
              ;;
          esac

  images-built:
    name: MockForge Ashburn images built
    needs: [plan, build]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.MOCKFORGE_AUTO_IMAGE_PUBLISH == 'true')
    # Report the publisher result without waiting for old CI listeners.
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.plan.result }}" = success
          test "${{ needs.build.result }}" = success
