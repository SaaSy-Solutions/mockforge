name: Ashburn registry and tunnel images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ashburn-images.yml'
      - 'Dockerfile.registry'
      - 'Dockerfile.tunnel'
      - 'crates/**'
      - 'Cargo.lock'
  workflow_dispatch:

# Also used by docker-build.yml for the root MockForge image. Expensive Rust
# Docker builds share the same self-hosted host and must run one at a time.
concurrency:
  group: mockforge-image-builds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: [self-hosted, linux, x64, rust]
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          sources = {
              'mockforge-registry': 'Dockerfile.registry',
              'mockforge-tunnel-relay': 'Dockerfile.tunnel',
          }
          include = [{'app': app, 'dockerfile': dockerfile} for app, dockerfile in sorted(sources.items())]
          print('matrix=' + json.dumps({'include': include}))
          PY

  build:
    needs: plan
    name: ${{ matrix.app }}
    runs-on:
      group: mockforge-image-publish
      labels: [self-hosted, linux, x64, mockforge-image-publish]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Attest publisher identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = mockforge-image-publish
          test "${DOCKER_HOST:-}" = "unix:///run/user/$(id -u)/docker.sock"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify isolated rootless Docker
        run: bash scripts/verify-image-publisher.sh
      - name: Create private Docker auth directory
        shell: bash
        run: |
          auth_dir="$(mktemp -d "$RUNNER_TEMP/ghcr-auth-XXXXXXXX")"
          chmod 700 "$auth_dir"
          echo "DOCKER_CONFIG=$auth_dir" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
        with:
          name: mockforge-ashburn-${{ github.run_id }}
          driver-opts: |
            memory=20g
            memory-swap=20g
      - name: Verify BuildKit memory cap
        run: |
          actual="$(docker inspect 'buildx_buildkit_mockforge-ashburn-${{ github.run_id }}0' --format '{{.HostConfig.Memory}}')"
          test "$actual" = "$(( 20 * 1024 * 1024 * 1024 ))"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/saasy-solutions/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ github.event_name }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ github.event_name }},mode=max
      - name: Record immutable digest
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          echo "${APP} ghcr.io/saasy-solutions/${APP}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private Docker auth
        if: always()
        shell: bash
        run: |
          case "${DOCKER_CONFIG:-}" in
            "$RUNNER_TEMP"/ghcr-auth-*)
              docker logout ghcr.io || true
              rm -rf -- "$DOCKER_CONFIG"
              ;;
          esac

  images-built:
    name: MockForge Ashburn images built
    needs: [plan, build]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, rust]
    steps:
      - run: |
          test "${{ needs.plan.result }}" = success
          test "${{ needs.build.result }}" = success
