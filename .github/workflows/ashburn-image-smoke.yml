name: MockForge image smoke

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/ashburn-images.yml'
      - '.github/workflows/ashburn-image-smoke.yml'
      - '.github/workflows/docker-build.yml'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'scripts/tests/k6_egress_e2e.sh'

concurrency:
  group: mockforge-image-builds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build root, registry, runner and egress images without publishing
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          name: mockforge-smoke-${{ github.run_id }}
          driver-opts: |
            memory=20g
            memory-swap=20g
      - name: Verify BuildKit memory cap
        run: |
          actual="$(docker inspect 'buildx_buildkit_mockforge-smoke-${{ github.run_id }}0' --format '{{.HostConfig.Memory}}')"
          test "$actual" = "$(( 20 * 1024 * 1024 * 1024 ))"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.registry
          platforms: linux/amd64
          push: false
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: false
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.egress
          platforms: linux/amd64
          push: false
          load: true
          tags: mockforge-egress:smoke-${{ github.run_id }}
      # k6 through the egress proxy reaches public targets and not internal
      # ones (the runner's k6 containment).
      - name: k6 egress containment
        env:
          EGRESS_IMAGE: mockforge-egress:smoke-${{ github.run_id }}
        run: bash scripts/tests/k6_egress_e2e.sh
      - name: Remove smoke egress image
        if: always()
        run: docker image rm -f "mockforge-egress:smoke-${{ github.run_id }}" || true
