name: Load Testing & Performance Regression

# Load tests run on main-push + manual dispatch only — NOT per-PR. Load testing
# and perf benchmarks as PR merge-gates burned a full release build + k6 run on
# every code PR against a single self-hosted runner, for a signal we don't gate
# merges on (none of these jobs are required checks). The regression we actually
# act on is "did this regress after landing on main", so they run post-merge.
# Nightly cron stays disabled (runner queue contention); use workflow_dispatch
# for on-demand runs.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'tests/load/**'
      - 'Cargo.toml'
      - '.github/workflows/load-testing.yml'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of load test to run'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - extended
          - stress

# All load/perf jobs run on refs/heads/main (post-merge) or manual dispatch.
# Concurrency keys are GitHub-internal context, safe to interpolate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # #1000: supersede an older run rather than queueing behind it. These jobs are
  # a post-merge regression signal, so only the newest main is interesting, and
  # mockforge has just TWO self-hosted runners: a stale load test holding one of
  # them starves the required checks on everything else.
  cancel-in-progress: true

jobs:
  standard-load-test:
    name: Standard Load Test
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 60
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'standard')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install k6
        run: 'command -v k6 > /dev/null 2>&1 || { echo "::error::k6 missing on self-hosted runner. Install: see https://k6.io/docs/getting-started/installation/"; exit 1; }'

      - name: Install protoc
        run: 'dpkg -s protobuf-compiler libfontconfig1-dev libglib2.0-dev libgtk-3-dev libsoup2.4-dev libasound2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev > /dev/null 2>&1 || { echo "::error::Required system deps missing on self-hosted runner. Run on the runner host: sudo apt-get install -y protobuf-compiler libfontconfig1-dev libglib2.0-dev libgtk-3-dev libsoup2.4-dev libasound2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev"; exit 1; }'

      - name: Build MockForge
        run: |
          cargo build --release --bin mockforge

      - name: Start MockForge server
        # --no-rate-limit: the built-in limiter defaults to 1000 req/min
        # (burst 2000) for the whole server. k6 drives ~100 req/s, so ~78% of
        # requests were 429s and the run measured the limiter, not mockforge.
        # RUST_LOG=warn + file redirect: at info the server writes ~7 lines per
        # request (millions in the extended run) into the job's stdout pipe.
        #
        # Ports are picked at random: the runner host is shared with other
        # projects' runners (a Next.js server held :3000 and answered our
        # health check with 404), and the standard and extended jobs can run
        # at the same time on the two mockforge runners there.
        env:
          RUST_LOG: warn
        run: |
          python3 - >> "$GITHUB_ENV" <<'EOF'
          import socket
          held = []
          for name in ("HTTP", "WS", "GRPC", "ADMIN", "METRICS"):
              s = socket.socket()
              s.bind(("", 0))
              held.append(s)
              print(f"MF_{name}_PORT={s.getsockname()[1]}")
          EOF
          . <(grep '^MF_' "$GITHUB_ENV" | sed 's/^/export /')
          ./target/release/mockforge serve --spec examples/user-management-api.json --no-rate-limit \
            --http-port "$MF_HTTP_PORT" --ws-port "$MF_WS_PORT" --grpc-port "$MF_GRPC_PORT" \
            --admin --admin-port "$MF_ADMIN_PORT" --metrics-port "$MF_METRICS_PORT" \
            > mockforge-server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do curl -sf "http://localhost:$MF_HTTP_PORT/health" > /dev/null && break; sleep 1; done
          kill -0 "$pid" || { echo "::error::mockforge exited during startup"; cat mockforge-server.log; exit 1; }
          curl -f "http://localhost:$MF_HTTP_PORT/health"

      - name: Run standard load test
        run: |
          cd tests/load
          BASE_URL="http://localhost:$MF_HTTP_PORT" k6 run --summary-export=load-test-results.json http_load.js

      - name: Upload load test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: load-test-results-standard
          path: |
            tests/load/load-test-results.json
            mockforge-server.log
          retention-days: 30

      - name: Check performance thresholds
        run: |
          python3 tests/load/check_thresholds.py tests/load/load-test-results.json tests/load/thresholds/standard.json

  extended-load-test:
    name: Extended Load Test
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 60
    if: |
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'extended')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install k6
        run: 'command -v k6 > /dev/null 2>&1 || { echo "::error::k6 missing on self-hosted runner. Install: see https://k6.io/docs/getting-started/installation/"; exit 1; }'

      - name: Install protoc
        run: 'dpkg -s protobuf-compiler libfontconfig1-dev libglib2.0-dev libgtk-3-dev libsoup2.4-dev libasound2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev > /dev/null 2>&1 || { echo "::error::Required system deps missing on self-hosted runner. Run on the runner host: sudo apt-get install -y protobuf-compiler libfontconfig1-dev libglib2.0-dev libgtk-3-dev libsoup2.4-dev libasound2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev"; exit 1; }'

      - name: Build MockForge
        run: |
          cargo build --release --bin mockforge

      - name: Start MockForge server
        # --no-rate-limit: the built-in limiter defaults to 1000 req/min
        # (burst 2000) for the whole server. k6 drives ~100 req/s, so ~78% of
        # requests were 429s and the run measured the limiter, not mockforge.
        # RUST_LOG=warn + file redirect: at info the server writes ~7 lines per
        # request (millions in the extended run) into the job's stdout pipe.
        #
        # Ports are picked at random: the runner host is shared with other
        # projects' runners (a Next.js server held :3000 and answered our
        # health check with 404), and the standard and extended jobs can run
        # at the same time on the two mockforge runners there.
        env:
          RUST_LOG: warn
        run: |
          python3 - >> "$GITHUB_ENV" <<'EOF'
          import socket
          held = []
          for name in ("HTTP", "WS", "GRPC", "ADMIN", "METRICS"):
              s = socket.socket()
              s.bind(("", 0))
              held.append(s)
              print(f"MF_{name}_PORT={s.getsockname()[1]}")
          EOF
          . <(grep '^MF_' "$GITHUB_ENV" | sed 's/^/export /')
          ./target/release/mockforge serve --spec examples/user-management-api.json --no-rate-limit \
            --http-port "$MF_HTTP_PORT" --ws-port "$MF_WS_PORT" --grpc-port "$MF_GRPC_PORT" \
            --admin --admin-port "$MF_ADMIN_PORT" --metrics-port "$MF_METRICS_PORT" \
            > mockforge-server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do curl -sf "http://localhost:$MF_HTTP_PORT/health" > /dev/null && break; sleep 1; done
          kill -0 "$pid" || { echo "::error::mockforge exited during startup"; cat mockforge-server.log; exit 1; }
          curl -f "http://localhost:$MF_HTTP_PORT/health"

      - name: Run extended load test
        run: |
          cd tests/load
          BASE_URL="http://localhost:$MF_HTTP_PORT" SUMMARY_FILE=load-test-results-extended.json k6 run http_load_high_scale.js

      - name: Upload load test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: load-test-results-extended
          path: |
            tests/load/load-test-results-extended.json
            mockforge-server.log
          retention-days: 90

      - name: Check performance thresholds
        run: |
          python3 tests/load/check_thresholds.py tests/load/load-test-results-extended.json tests/load/thresholds/extended.json

      - name: Compare with baseline
        run: |
          python3 tests/load/compare_baseline.py tests/load/load-test-results-extended.json

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 60
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run benchmarks
        # criterion 0.5 has no `json` output format (only `criterion` and
        # `bencher`), and without pipefail `tee` hid the resulting error.
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p mockforge-core --bench core_benchmarks -- --output-format bencher | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 90

      - name: Check for performance regressions
        if: false  # Script doesn't exist yet, skip for now
        run: |
          echo "Performance regression check script not yet implemented"
          # python3 scripts/check_benchmark_regressions.py benchmark-results.json
