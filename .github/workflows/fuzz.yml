name: Fuzz Testing

# Cron disabled — runner queue contention; manual workflow_dispatch still works.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzzing duration in seconds'
        required: false
        default: '300'

# If a cron tick fires while the previous tick is still running, supersede the
# older one — the input is just "latest main", no value in running both.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz Tests
    runs-on: [self-hosted, linux, x64, rust]
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      # The corpus used to live in actions/cache, which is billed GitHub
      # storage. Keep it on this runner's disk instead. It is small (inputs,
      # not build output) and per-runner, so concurrent runs never share it.
      - name: Restore fuzz corpus from the runner disk
        run: |
          store="/tmp/mockforge-fuzz-corpus-${RUNNER_NAME:?}"
          mkdir -p crates/mockforge-core/fuzz/corpus
          if [ -d "$store" ] && [ ! -L "$store" ]; then
            cp -a "$store/." crates/mockforge-core/fuzz/corpus/
          fi

      - name: Run OpenAPI parser fuzzer
        working-directory: crates/mockforge-core
        run: |
          timeout ${{ github.event.inputs.duration || 300 }} \
          cargo +nightly fuzz run fuzz_openapi_parser -- -max_total_time=${{ github.event.inputs.duration || 300 }} \
          || [ $? -eq 124 ]

      - name: Run template engine fuzzer
        working-directory: crates/mockforge-core
        run: |
          timeout ${{ github.event.inputs.duration || 300 }} \
          cargo +nightly fuzz run fuzz_template_engine -- -max_total_time=${{ github.event.inputs.duration || 300 }} \
          || [ $? -eq 124 ]

      - name: Run JSON validator fuzzer
        working-directory: crates/mockforge-core
        run: |
          timeout ${{ github.event.inputs.duration || 300 }} \
          cargo +nightly fuzz run fuzz_json_validator -- -max_total_time=${{ github.event.inputs.duration || 300 }} \
          || [ $? -eq 124 ]

      - name: Save fuzz corpus to the runner disk
        if: always()
        run: |
          store="/tmp/mockforge-fuzz-corpus-${RUNNER_NAME:?}"
          [ ! -L "$store" ] || { echo "::warning::$store is a symlink; not saving corpus"; exit 0; }
          mkdir -p "$store"
          if [ -d crates/mockforge-core/fuzz/corpus ]; then
            cp -a crates/mockforge-core/fuzz/corpus/. "$store/"
          fi

      - name: Check for crashes
        id: check_crashes
        run: |
          if [ -d "crates/mockforge-core/fuzz/artifacts" ]; then
            crashes=$(find crates/mockforge-core/fuzz/artifacts -name "crash-*" | wc -l)
            echo "crashes=$crashes" >> $GITHUB_OUTPUT
            if [ $crashes -gt 0 ]; then
              echo "::warning::Found $crashes crash(es) during fuzzing"
            fi
          else
            echo "crashes=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload crash artifacts
        if: steps.check_crashes.outputs.crashes != '0'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-crash-artifacts
          path: crates/mockforge-core/fuzz/artifacts/
          # Crash reproducers are tiny and needed for triage of the issue below.
          retention-days: 7

      - name: Create issue on crash
        if: steps.check_crashes.outputs.crashes != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const crashes = ${{ steps.check_crashes.outputs.crashes }};

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🐛 Fuzz testing discovered ${crashes} crash(es)`,
              body: `Automated fuzz testing has discovered ${crashes} crash(es).\n\n` +
                    `Please review the crash artifacts and fix the underlying issues.\n\n` +
                    `**Workflow Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'fuzzing', 'security']
            });
