name: Security Rule Test Packs

on:
  pull_request:
    paths:
      - 'scripts/security_rule_test_pack.py'
      - 'scripts/security_rule_pack_*.py'
      - 'scripts/tests/test_security_rule_test_pack.py'
      - 'examples/security-rule-packs/**'
      - '.github/workflows/security-rule-packs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Exact assertions, origin correlation and CLI exit semantics
        run: python3 scripts/tests/test_security_rule_test_pack.py
