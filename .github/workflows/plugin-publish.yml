name: Publish Plugin to Registry

on:
  push:
    tags:
      # Crate releases belong to release.yml, never the plugin publisher.
      - 'plugin-*'
  workflow_dispatch:
    inputs:
      plugin_path:
        description: 'Path to plugin directory'
        required: true
        default: '.'
      dry_run:
        description: 'Dry run (validate only, do not publish)'
        required: false
        type: boolean
        default: false

# Serialize publishes — never abort an in-flight release mid-publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MOCKFORGE_REGISTRY_URL: ${{ secrets.MOCKFORGE_REGISTRY_URL || 'https://registry.mockforge.dev' }}
  MOCKFORGE_REGISTRY_TOKEN: ${{ secrets.MOCKFORGE_REGISTRY_TOKEN }}

jobs:
  request:
    name: Classify plugin request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MOCKFORGE_REGISTRY_TOKEN: ''
    outputs:
      requested: ${{ steps.request.outputs.requested }}
      plugin_path: ${{ steps.request.outputs.plugin_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Validate plugin request and path
        id: request
        env:
          INPUT_PLUGIN_PATH: ${{ inputs.plugin_path }}
        run: python3 scripts/plugin_publish_request.py

  validate:
    name: Validate Plugin
    needs: request
    if: needs.request.outputs.requested == 'true'
    runs-on: ubuntu-latest
    env:
      PLUGIN_PATH: ${{ needs.request.outputs.plugin_path }}
    outputs:
      plugin_name: ${{ steps.manifest.outputs.name }}
      plugin_version: ${{ steps.manifest.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read plugin manifest
        id: manifest
        run: |
          PLUGIN_NAME=$(yq eval '.name' "./$PLUGIN_PATH/plugin.yaml")
          PLUGIN_VERSION=$(yq eval '.version' "./$PLUGIN_PATH/plugin.yaml")
          echo "name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          echo "version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT
          echo "Plugin: $PLUGIN_NAME v$PLUGIN_VERSION"

      - name: Setup Rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Build MockForge CLI
        run: |
          cargo build --release --package mockforge-cli --features all-protocols

      - name: Validate manifest
        run: |
          ./target/release/mockforge plugin validate "$GITHUB_WORKSPACE/$PLUGIN_PATH"

      - name: Run tests
        run: |
          cargo test --release --manifest-path "./$PLUGIN_PATH/Cargo.toml"

  security-scan:
    name: Security Scan
    needs: [request, validate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.request.outputs.plugin_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: clippy
          override: true

      - name: Run Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ needs.request.outputs.plugin_path }}

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check licenses sources
          manifest-path: ./${{ needs.request.outputs.plugin_path }}/Cargo.toml

      - name: Security scan summary
        run: |
          echo "✅ Security checks passed"

  build:
    name: Build Plugin
    needs: [request, validate, security-scan]
    env:
      PLUGIN_PATH: ${{ needs.request.outputs.plugin_path }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: dll

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          profile: minimal
          override: true

      - name: Build plugin
        run: cargo build --release --manifest-path "./$PLUGIN_PATH/Cargo.toml" --target ${{ matrix.target }}

      - name: Package plugin
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/*.${{ matrix.ext }} artifacts/ || true
          cp "./$PLUGIN_PATH/plugin.yaml" artifacts/
          cp "./$PLUGIN_PATH/README.md" artifacts/ || true
          cp "./$PLUGIN_PATH/LICENSE" artifacts/ || true

      - name: Calculate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: plugin-${{ matrix.os }}
          path: artifacts/

  publish:
    name: Publish to Registry
    needs: [request, validate, build]
    env:
      PLUGIN_PATH: ${{ needs.request.outputs.plugin_path }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Build MockForge CLI
        run: |
          cargo build --release --package mockforge-cli --features all-protocols

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Login to registry
        run: |
          ./target/release/mockforge plugin registry login --token "${{ secrets.MOCKFORGE_REGISTRY_TOKEN }}"

      - name: Publish plugin
        run: |
          cd -- "$PLUGIN_PATH"
          "$GITHUB_WORKSPACE/target/release/mockforge" plugin registry publish
        env:
          MOCKFORGE_REGISTRY_TOKEN: ${{ secrets.MOCKFORGE_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Plugin: ${{ needs.validate.outputs.plugin_name }} v${{ needs.validate.outputs.plugin_version }}

            Published to MockForge Plugin Registry

            ### Installation
            ```bash
            mockforge plugin registry install ${{ needs.validate.outputs.plugin_name }}
            ```

            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false

  dry-run:
    name: Dry Run (Validation Only)
    needs: [request, validate, security-scan, build]
    env:
      PLUGIN_PATH: ${{ needs.request.outputs.plugin_path }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Build MockForge CLI
        run: |
          cargo build --release --package mockforge-cli --features all-protocols

      - name: Dry run publish
        run: |
          cd -- "$PLUGIN_PATH"
          "$GITHUB_WORKSPACE/target/release/mockforge" plugin registry publish --dry-run

      - name: Summary
        run: |
          echo "✅ Dry run completed successfully"
          echo "Plugin would be published with:"
          echo "  Name: ${{ needs.validate.outputs.plugin_name }}"
          echo "  Version: ${{ needs.validate.outputs.plugin_version }}"

  notify:
    name: Notify
    needs: [publish]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify success
        if: needs.publish.result == 'success'
        run: |
          echo "✅ Plugin published successfully!"

      - name: Notify failure
        if: needs.publish.result == 'failure'
        run: |
          echo "❌ Plugin publish failed"
          exit 1
