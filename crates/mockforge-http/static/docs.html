<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MockForge API Docs</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .no-spec {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; color: #64748b;
    }
    .no-spec h1 { font-size: 1.5rem; color: #334155; margin-bottom: 0.5rem; }
    .no-spec a { color: #3b82f6; text-decoration: none; }
    .no-spec a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="no-spec" class="no-spec" style="display: none;">
    <div>
      <h1>No OpenAPI Spec Loaded</h1>
      <p>This mock server is running in config-only mode, or the management
        token is missing.</p>
    </div>
  </div>
  <script id="api-reference" style="display: none;"></script>
  <script>
    // The spec is part of MockForge's control plane, so it needs the
    // management token. Callers pass it in the URL fragment
    // (#management_token=...), which browsers never send to a server.
    // Drop the fragment from the address bar once read.
    var token = new URLSearchParams(window.location.hash.slice(1)).get('management_token');
    if (token) {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    var headers = token ? { 'X-MockForge-Management-Token': token } : {};
    fetch('/__mockforge/api/spec', { headers: headers })
      .then(function(r) {
        if (!r.ok) throw new Error('No spec');
        return r.text();
      })
      .then(function(specContent) {
        // Hand Scalar the spec text so it does not fetch it again without
        // the token.
        var ref = document.getElementById('api-reference');
        ref.removeAttribute('style');
        ref.setAttribute('type', 'application/json');
        ref.setAttribute('data-proxy-url', '');
        ref.textContent = specContent;

        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@scalar/api-reference';
        document.body.appendChild(script);
      })
      .catch(function() {
        document.getElementById('no-spec').style.display = 'flex';
      });
  </script>
</body>
</html>
