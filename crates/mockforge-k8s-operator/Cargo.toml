[package]
rust-version.workspace = true
name = "mockforge-k8s-operator"
version.workspace = true
edition = "2021"
authors = ["SaaSy Solutions LLC <ray.clanan@saasysolutionsllc.com>"]
license = "MIT OR Apache-2.0"
description = "Kubernetes operator for MockForge - manage mock services as Kubernetes resources"
repository = "https://github.com/SaaSy-Solutions/mockforge"
homepage = "https://mockforge.dev"
documentation = "https://docs.rs/mockforge"
readme = "README.md"
keywords = ["mock", "api", "testing", "kubernetes", "operator"]
categories = ["development-tools", "api-bindings"]

[dependencies]
# Kubernetes client
kube = { version = "4.2.0", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }

# Async runtime
tokio = { version = "1.52", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = { version = "1", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cron expression parsing
cron = "0.15"

# MockForge dependencies
mockforge-chaos = { version = "0.3.236", path = "../mockforge-chaos" }

# Metrics
prometheus = { version = "0.14", features = ["process"] }

[dev-dependencies]
