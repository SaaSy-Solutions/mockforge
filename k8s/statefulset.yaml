# A StatefulSet rather than a Deployment so every replica gets its own
# recorder volume (volumeClaimTemplates below). The recorder keeps a SQLite
# database at /app/data, and SQLite must not be shared between processes,
# let alone mounted ReadWriteOnce into pods on different nodes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mockforge
  labels:
    app: mockforge
    version: v1
spec:
  replicas: 3
  # Governing headless Service (k8s/service.yaml); gives each pod a stable
  # DNS name, mockforge-N.mockforge-headless.<namespace>.svc.
  serviceName: mockforge-headless
  # Replicas do not depend on each other, so start and replace them all at
  # once instead of one at a time (OrderedReady).
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mockforge
  template:
    metadata:
      labels:
        app: mockforge
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mockforge
      containers:
      - name: mockforge
        image: ghcr.io/saasy-solutions/mockforge:latest
        imagePullPolicy: IfNotPresent
        # Satisfies the "restricted" Pod Security Standard enforced on the
        # mockforge namespace (k8s/pod-security.yaml).
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: websocket
          containerPort: 3001
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        - name: admin
          containerPort: 9080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        - name: MOCKFORGE_HTTP_PORT
          value: "3000"
        - name: MOCKFORGE_WS_PORT
          value: "3001"
        - name: MOCKFORGE_GRPC_PORT
          value: "50051"
        - name: MOCKFORGE_ADMIN_PORT
          value: "9080"
        - name: MOCKFORGE_METRICS_PORT
          value: "9090"
        - name: MOCKFORGE_ADMIN_ENABLED
          value: "true"
        - name: MOCKFORGE_METRICS_ENABLED
          value: "true"
        - name: MOCKFORGE_TRACING_ENABLED
          value: "true"
        - name: MOCKFORGE_CHAOS_ENABLED
          value: "true"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Probes use the HTTP port: the admin port puts /health/* behind admin
        # auth, so kubelet probes there get 401.
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: fixtures
          mountPath: /app/fixtures
          readOnly: true
        - name: cache
          mountPath: /app/cache
        # Per-pod claim from volumeClaimTemplates (recorder-db-mockforge-N).
        - name: recorder-db
          mountPath: /app/data
      volumes:
      - name: config
        configMap:
          name: mockforge-config
      - name: fixtures
        configMap:
          name: mockforge-fixtures
      - name: cache
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - mockforge
              topologyKey: kubernetes.io/hostname
      # UID/GID 999 is the `mockforge` user baked into the image (Dockerfile
      # `useradd -r`); it owns /app and $HOME, which the server writes to.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
  - metadata:
      name: recorder-db
      labels:
        app: mockforge
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: standard  # Adjust based on your cluster
